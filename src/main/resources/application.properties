spring.application.name=cgpa-calculator
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cgpa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cgpa_user}
spring.datasource.password=${DB_PASSWORD:local_cgpa_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.error.include-message=never
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}